# =============================================================================
# Cluster Node Registry
# =============================================================================
# One line per node. Format:
#   NAME  REGION          HOSTNAME
#
# HOSTNAME = how other nodes reach this node's PostgreSQL port.
#            Must be resolvable from every node (IP, VPN hostname, or FQDN).
#
# Lines starting with # are ignored. Managed by scripts/add-node.sh.
# =============================================================================
