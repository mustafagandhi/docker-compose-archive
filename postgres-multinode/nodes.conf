# =============================================================================
# Cluster Node Registry
# =============================================================================
# Add one line per node. Format:
#   NODE_NAME  REGION          HOSTNAME
#
# HOSTNAME = how other nodes reach this node's PostgreSQL (IP, VPN hostname,
#            or FQDN). All nodes must be able to resolve every other node's
#            hostname.
#
# Example 3-node cluster:
n1  ap-south-1      node-india.netbird.cloud
n2  us-east-1       node-us-east.netbird.cloud
n3  ap-northeast-1  node-tokyo.netbird.cloud
