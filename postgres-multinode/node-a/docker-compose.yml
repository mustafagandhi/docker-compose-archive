# =============================================================================
# pgEdge Node A — First node in the cluster
#
# Copy this directory to each server. Before starting:
#   1. Set NODE_NAME in .env (must match a name in nodes.conf)
#   2. Generate db.json:  ../scripts/generate-db-json.sh
#   3. docker compose up -d
# =============================================================================

services:
  pgedge:
    image: pgedge/pgedge:pg16-latest
    container_name: pgedge-${NODE_NAME}
    restart: unless-stopped
    hostname: ${NODE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgedge-data:/data
    configs:
      - source: db_config
        target: /home/pgedge/db.json
        uid: "1020"
        gid: "1020"
        mode: 0440
    environment:
      - NODE_NAME=${NODE_NAME}
      - PGDATA=/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgedge -d defaultdb -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgcat:
    image: pgedge/pgcat:1.0
    container_name: pgcat-${NODE_NAME}
    restart: unless-stopped
    depends_on:
      pgedge:
        condition: service_healthy
    ports:
      - "6432:6432"
    configs:
      - source: db_config
        target: /home/pgedge/db.json
        uid: "1020"
        gid: "1020"
        mode: 0440
    environment:
      - NODE_NAME=${NODE_NAME}

configs:
  db_config:
    file: ./db.json

volumes:
  pgedge-data:
    driver: local
