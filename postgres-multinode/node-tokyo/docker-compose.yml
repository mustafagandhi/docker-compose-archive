# =============================================================================
# pgEdge Multi-Active Write Node - Tokyo (ap-northeast-1)
# Node: n3
#
# Networking: Netbird VPN + Traefik TLS (both included)
# - Netbird provides encrypted mesh VPN between all nodes
# - Traefik provides TLS termination for external/application access
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Netbird VPN Client - Encrypted mesh network between all nodes
  # ---------------------------------------------------------------------------
  netbird:
    image: netbirdio/netbird:latest
    container_name: netbird-tokyo
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - NB_SETUP_KEY=${NETBIRD_SETUP_KEY}
      - NB_MANAGEMENT_URL=${NETBIRD_MANAGEMENT_URL:-https://api.netbird.io}
      - NB_HOSTNAME=node-tokyo
    volumes:
      - netbird-config:/etc/netbird
    networks:
      - database

  # ---------------------------------------------------------------------------
  # Traefik Reverse Proxy - TLS termination + TCP routing
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    container_name: traefik-tokyo
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.postgres.address=:5432
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
      - "5432:5432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - ./traefik-dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik
      - database

  # ---------------------------------------------------------------------------
  # pgEdge PostgreSQL Node - Multi-active write with Spock replication
  # ---------------------------------------------------------------------------
  pgedge:
    image: pgedge/pgedge:pg16-latest
    container_name: pgedge-tokyo
    restart: unless-stopped
    hostname: pgedge-n3
    volumes:
      - pgedge-data:/data
      - ./db.json:/opt/pgedge/conf/db.json:ro
    environment:
      - PGEDGE_NODE_NAME=n3
    networks:
      database:
        aliases:
          - pgedge-n3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgedge -d defaultdb -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.pgedge-tokyo.rule=HostSNI(`${TRAEFIK_DOMAIN}`)"
      - "traefik.tcp.routers.pgedge-tokyo.entrypoints=postgres"
      - "traefik.tcp.routers.pgedge-tokyo.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.pgedge-tokyo.loadbalancer.server.port=5432"

  # ---------------------------------------------------------------------------
  # pgCat - Connection Pooler
  # ---------------------------------------------------------------------------
  pgcat:
    image: pgedge/pgcat:1.0
    container_name: pgcat-tokyo
    restart: unless-stopped
    depends_on:
      pgedge:
        condition: service_healthy
    volumes:
      - ./db.json:/opt/pgedge/conf/db.json:ro
    environment:
      - PGEDGE_NODE_NAME=n3
    networks:
      database:
        aliases:
          - pgcat-n3
      traefik: {}
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.pgcat-tokyo.rule=HostSNI(`n3.${TRAEFIK_DOMAIN}`)"
      - "traefik.tcp.routers.pgcat-tokyo.entrypoints=websecure"
      - "traefik.tcp.routers.pgcat-tokyo.tls=true"
      - "traefik.tcp.routers.pgcat-tokyo.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.pgcat-tokyo.loadbalancer.server.port=6432"

volumes:
  pgedge-data:
    driver: local
  traefik-certs:
    driver: local
  netbird-config:
    driver: local

networks:
  traefik:
    name: traefik
  database:
    name: database
