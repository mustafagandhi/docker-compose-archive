# =============================================================================
# pgEdge Multi-Active Write Node
# =============================================================================
# Every node in the cluster runs this same compose file.
# The only difference per node is NODE_NAME in the .env file.
#
# Deploy:
#   1. Copy this directory to a server
#   2. Set NODE_NAME in .env  (must match a name in nodes.conf)
#   3. Place the generated db.json alongside this file
#   4. docker compose up -d
# =============================================================================

services:
  # PostgreSQL 16 with Spock multi-active write replication.
  # Spock sets up bidirectional logical replication between all nodes
  # listed in db.json. Every node can accept reads and writes.
  pgedge:
    image: pgedge/pgedge:pg16-latest
    container_name: pgedge-${NODE_NAME}
    restart: unless-stopped
    hostname: ${NODE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgedge-data:/data
    configs:
      - source: db_config
        target: /home/pgedge/db.json
        uid: "1020"
        gid: "1020"
        mode: 0440
    environment:
      - NODE_NAME=${NODE_NAME}
      - PGDATA=/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgedge -d defaultdb -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Connection pooler. Sits in front of pgEdge and provides
  # connection pooling for application traffic.
  pgcat:
    image: pgedge/pgcat:1.0
    container_name: pgcat-${NODE_NAME}
    restart: unless-stopped
    depends_on:
      pgedge:
        condition: service_healthy
    ports:
      - "6432:6432"
    configs:
      - source: db_config
        target: /home/pgedge/db.json
        uid: "1020"
        gid: "1020"
        mode: 0440
    environment:
      - NODE_NAME=${NODE_NAME}

configs:
  db_config:
    file: ./db.json

volumes:
  pgedge-data:
    driver: local
