# Traefik v3 + Komodo (Core + Periphery + MongoDB)
# Deploy first — everything else depends on this.
#
# Prerequisites:
#   docker network create proxy
#   docker network create komodo
#   mkdir -p /opt/traefik/{letsencrypt,dynamic,logs}

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    labels:
      komodo.skip:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${DOMAIN}`)"
      traefik.http.routers.traefik-dashboard.entrypoints: "websecure"
      traefik.http.routers.traefik-dashboard.service: "api@internal"
      traefik.http.routers.traefik-dashboard.middlewares: "traefik-auth@file,secure-headers@file"
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "3"}
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=INFO"
      - "--log.filepath=/logs/traefik.log"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.bufferingsize=100"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addentrypointslabels=true"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}"
      - "--entrypoints.websecure.transport.respondingtimeouts.readtimeout=0"
      - "--entrypoints.websecure.transport.respondingtimeouts.writetimeout=0"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=5"
      - "--certificatesresolvers.cloudflare.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/traefik/letsencrypt:/letsencrypt
      - /opt/traefik/dynamic:/dynamic:ro
      - /opt/traefik/logs:/logs
    networks:
      - proxy

  komodo-mongo:
    image: mongo:7
    container_name: komodo-mongo
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    labels:
      komodo.skip:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "2"}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb
    networks:
      - komodo

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:${KOMODO_IMAGE_TAG:-latest}
    container_name: komodo-core
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "3"}
    depends_on:
      komodo-mongo:
        condition: service_healthy
    labels:
      komodo.skip:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.komodo.rule: "Host(`komodo.${DOMAIN}`)"
      traefik.http.routers.komodo.entrypoints: "websecure"
      traefik.http.routers.komodo.middlewares: "secure-headers@file"
      traefik.http.services.komodo.loadbalancer.server.port: "9120"
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      - /opt/komodo/backups:/backups
      - /opt/komodo/syncs:/syncs
    networks:
      - proxy
      - komodo

  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:${KOMODO_IMAGE_TAG:-latest}
    container_name: komodo-periphery
    restart: unless-stopped
    labels:
      komodo.skip:
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "2"}
    env_file: ./compose.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /opt/komodo/data:/komodo-data
    networks:
      - komodo

volumes:
  komodo-mongo-data:
    name: komodo_mongo-data
  komodo-mongo-config:
    name: komodo_mongo-config

networks:
  proxy:
    external: true
  komodo:
    external: true
