# pgAdmin — PostgreSQL Web Management UI
# Shared across all projects. Connects to any Postgres on any network.
#
# Before pasting into Komodo:
#   Add all app networks this pgAdmin needs access to under 'networks'

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      # Required for reverse proxy (Traefik) — tells pgAdmin it's behind HTTPS
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "0"
      # Session cookie security — must match HTTPS behind proxy
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_SAMESITE: "'Lax'"
      # CSRF — trust the proxy chain (Cloudflare → Traefik → pgAdmin)
      PGADMIN_CONFIG_WTF_CSRF_SSL_STRICT: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "True"
      PGADMIN_CONFIG_WTF_CSRF_HEADERS: "['X-CSRFToken', 'X-CSRF-Token']"
      # Disable enhanced cookie protection — incompatible with Cloudflare's
      # rotating edge IPs which cause session validation failures on static assets
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.pgadmin.rule: "Host(`pgadmin.example.com`)"
      traefik.http.routers.pgadmin.entrypoints: "websecure"
      traefik.http.routers.pgadmin.middlewares: "secure-headers@file"
      # Ensure sticky sessions — pgAdmin requires cookie affinity
      traefik.http.services.pgadmin.loadbalancer.sticky.cookie: "true"
      traefik.http.services.pgadmin.loadbalancer.sticky.cookie.name: "pgadmin_route"
      traefik.http.services.pgadmin.loadbalancer.sticky.cookie.secure: "true"
      traefik.http.services.pgadmin.loadbalancer.server.port: "5050"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "2"}
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - proxy
      - myapp
      # Add more app networks as needed:
      # - shop
      # - cms

volumes:
  pgadmin-data:
    name: pgadmin-data

networks:
  proxy:
    external: true
  myapp:
    external: true
